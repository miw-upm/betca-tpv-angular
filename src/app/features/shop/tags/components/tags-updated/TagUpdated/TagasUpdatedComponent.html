<mat-card>
    <mat-card-header>
      <mat-card-title>Update Tag</mat-card-title>
    </mat-card-header>
  
    <mat-card-content>
      <form [formGroup]="tagForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" required>
          <mat-error *ngIf="tagForm.get('name')?.hasError('required')">
            Name is required
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Group</mat-label>
          <input matInput formControlName="group" required>
          <mat-error *ngIf="tagForm.get('group')?.hasError('required')">
            Group is required
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" required></textarea>
          <mat-error *ngIf="tagForm.get('description')?.hasError('required')">
            Description is required
          </mat-error>
        </mat-form-field>
  
        <div class="button-container">
          <button mat-button type="button" (click)="onCancel()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="!tagForm.valid">
            Update
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
