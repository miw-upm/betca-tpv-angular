<div class="reviews-container">
    <h2>My Purchased Products</h2>
    <table>
        <thead>
        <tr>
            <th>Pedido</th>
            <th>Stars</th>
            <th>Opinion</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let review of reviews">
            <td>
                <div class="pedido-container">
                    <img [src]="review.article.imageUrl" alt="Product" class="pedido-image" />
                    <div class="pedido-text">
                        <strong>{{ review.article.name }}</strong>
                        <p>{{ review.article.description }}</p>
                    </div>
                </div>
            </td>
            <td>
                <mat-icon *ngFor="let star of [1, 2, 3, 4, 5]"
                          (click)="rateProduct(review, star)"
                          [ngClass]="{ 'selected': star <= review.stars }">
                    star
                </mat-icon>
            </td>
            <td>
                <input [(ngModel)]="review.opinion" placeholder="Write your review..." />
            </td>
        </tr>
        </tbody>
    </table>
    <div *ngIf="popularArticleId">
        <h3>Most Popular Article ID: {{ popularArticleId }}</h3>
    </div>
</div>
