<h2 mat-dialog-title>Update Complaint</h2>
<mat-dialog-content>
    <div class="row">
        <mat-form-field class="full-width">
            <mat-label>Description</mat-label>
            <input [(ngModel)]="complaint.description" matInput  type="text" required/>
        </mat-form-field>
    </div>

</mat-dialog-content>
<mat-dialog-actions>
    <button mat-dialog-close mat-raised-button>Close</button>
    <button (click)="update()" [disabled]="invalid()" color="primary" mat-raised-button>Update
    </button>
</mat-dialog-actions>
