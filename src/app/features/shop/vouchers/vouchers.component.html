<mat-card>
    <mat-card-title>
        <mat-icon>search</mat-icon>
        Filters
    </mat-card-title>
    <mat-card-content>
        <app-filter-input [(value)]="voucherSearch.reference" title="Reference"></app-filter-input>
        <app-filter-input [(value)]="voucherSearch.value" title="Value less than"></app-filter-input>
        <button (click)="search()" mat-stroked-button>
            <mat-icon>search</mat-icon>
            Find
        </button>
    </mat-card-content>
</mat-card>

<app-crud (create)="create()" (read)="read($event)" (print)="print($event)"
          [data]="vouchers" [deleteAction]="false" [updateAction]="false" [title]="title"></app-crud>
