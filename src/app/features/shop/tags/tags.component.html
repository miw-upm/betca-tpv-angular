<mat-card class="filter-card">
    <mat-card-title>
        <mat-icon>local_offer</mat-icon>
        <span>Tag Management</span>
    </mat-card-title>
    <mat-card-content>
        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button mat-raised-button [color]="currentFilter === 'all' ? 'primary' : ''" (click)="setFilter('all')">
                <mat-icon>list</mat-icon>
                All Tags
            </button>
            <button mat-raised-button [color]="currentFilter === 'popular' ? 'primary' : ''" (click)="setFilter('popular')">
                <mat-icon>star</mat-icon>
                Popular
            </button>
            <button mat-raised-button [color]="currentFilter === 'sale' ? 'primary' : ''" (click)="setFilter('sale')">
                <mat-icon>local_offer</mat-icon>
                Sale
            </button>
            <button mat-raised-button [color]="currentFilter === 'new' ? 'primary' : ''" (click)="setFilter('new')">
                <mat-icon>fiber_new</mat-icon>
                New
            </button>
        </div>

        <!-- Search Filters -->
        <div class="filters-container" *ngIf="currentFilter === 'all'">
            <app-filter-input [(value)]="tagSearch.name" title="Name"></app-filter-input>
            <app-filter-input [(value)]="tagSearch.group" title="Group"></app-filter-input>
            <app-filter-input [(value)]="tagSearch.description" title="Description"></app-filter-input>
            <button (click)="search()" mat-raised-button color="primary">
                <mat-icon>search</mat-icon>
                Search
            </button>
        </div>
    </mat-card-content>
</mat-card>

<mat-card class="table-card">
    <mat-card-content>
        <div class="table-container mat-elevation-z8">
            <div class="table-header">
                <button mat-raised-button color="primary" (click)="create()" *ngIf="auth.isAdmin">
                    <mat-icon>add</mat-icon>
                    New Tag
                </button>
            </div>
            
            <table mat-table [dataSource]="tags$ | async" class="mat-elevation-z8">
                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>Name</th>
                    <td mat-cell *matCellDef="let tag">{{tag.name}}</td>
                </ng-container>

                <!-- Group Column -->
                <ng-container matColumnDef="group">
                    <th mat-header-cell *matHeaderCellDef>Group</th>
                    <td mat-cell *matCellDef="let tag">{{tag.group}}</td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let tag">{{tag.description}}</td>
                </ng-container>

                <!-- Popular Column -->
                <ng-container matColumnDef="isPopular">
                    <th mat-header-cell *matHeaderCellDef>Popular</th>
                    <td mat-cell *matCellDef="let tag">
                        <mat-icon *ngIf="tag.isPopular" color="accent">star</mat-icon>
                        <mat-icon *ngIf="!tag.isPopular" color="disabled">star_border</mat-icon>
                    </td>
                </ng-container>

                <!-- Sale Column -->
                <ng-container matColumnDef="isOnSale">
                    <th mat-header-cell *matHeaderCellDef>Sale</th>
                    <td mat-cell *matCellDef="let tag">
                        <mat-icon *ngIf="tag.isOnSale" color="warn">local_offer</mat-icon>
                        <mat-icon *ngIf="!tag.isOnSale" color="disabled">local_offer</mat-icon>
                    </td>
                </ng-container>

                <!-- New Column -->
                <ng-container matColumnDef="isNew">
                    <th mat-header-cell *matHeaderCellDef>New</th>
                    <td mat-cell *matCellDef="let tag">
                        <mat-icon *ngIf="tag.isNew" color="primary">fiber_new</mat-icon>
                        <mat-icon *ngIf="!tag.isNew" color="disabled">fiber_new</mat-icon>
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let tag">
                        <button mat-icon-button color="primary" (click)="view(tag)" matTooltip="View Tag">
                            <mat-icon>visibility</mat-icon>
                        </button>
                        <button mat-icon-button color="accent" (click)="update(tag)" *ngIf="auth.isAdmin" matTooltip="Edit Tag">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="delete(tag)" *ngIf="auth.isAdmin" matTooltip="Delete Tag">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="['name', 'group', 'description', 'isPopular', 'isOnSale', 'isNew', 'actions']"></tr>
                <tr mat-row *matRowDef="let row; columns: ['name', 'group', 'description', 'isPopular', 'isOnSale', 'isNew', 'actions'];"></tr>
            </table>

            <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]"></mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
