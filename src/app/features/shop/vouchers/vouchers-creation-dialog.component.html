<h4 mat-dialog-title>{{ title }}</h4>
<mat-dialog-content>
    <mat-form-field class="full-width">
        <mat-label>Reference</mat-label>
        <input [(ngModel)]="voucher.reference" id="company" matInput required type="text"/>
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Value</mat-label>
        <input [(ngModel)]="voucher.value" matInput required type="text"/>
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Creation date</mat-label>
        <input [(ngModel)]="voucher.creationDate" matInput required type="date">
        <mat-hint>9 digits</mat-hint>
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Date of use</mat-label>
        <input [(ngModel)]="voucher.dateOfUse" matInput type="date">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Phone number</mat-label>
        <input [(ngModel)]="voucher.user" matInput type="text"/>
    </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-dialog-close mat-raised-button>Close</button>
    <button (click)="create()" *ngIf="isCreate()" [disabled]=invalid() color="primary" mat-raised-button>Create
    </button>
</mat-dialog-actions>
