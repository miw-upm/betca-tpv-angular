<h4 mat-dialog-title>{{ title }}</h4>
<mat-dialog-content>
    <mat-form-field class="full-width">
        <mat-label>Reference</mat-label>
        <input [(ngModel)]="order.reference" matInput type="text">
    </mat-form-field>
    <mat-form-field class="full-width">
        <mat-label>Description</mat-label>
        <input [(ngModel)]="order.description" matInput required type="text"/>
    </mat-form-field> 
    <mat-form-field class="full-width" *ngIf="!isCreate()">
        <mat-label>Opening Date</mat-label>
        <input [(ngModel)]="order.openingDate" matInput [matDatepicker]="picker">
        <mat-hint>MM/DD/YYYY</mat-hint>
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <app-search-by-company [(company)]="order.providerCompany" (companyChange)="onCompanyChange()" class="full-width"></app-search-by-company>
    <div *ngIf="articles.length > 0">
        <div *ngFor="let article of articles">
            <mat-form-field class="full-width">
                <mat-label>{{ article.barcode }}</mat-label>
                <input [(ngModel)]="article.amount" matInput type="number" min="0" step="1"/>
            </mat-form-field>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-dialog-close mat-raised-button>Close</button>
    <button (click)="create()" *ngIf="isCreate()" [disabled]=invalid() color="primary" mat-raised-button>Create
    </button>
    <button (click)="update()" *ngIf="!isCreate()" [disabled]=invalid() color="primary" mat-raised-button>Update
    </button>
</mat-dialog-actions>
